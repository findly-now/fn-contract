openapi: 3.0.3
info:
  title: Posts Domain API
  description: |
    Photo-first lost & found posts management API providing rapid item reporting,
    geospatial discovery, and post lifecycle management.

    Enables <15 second post creation workflows through optimized photo upload,
    location-based search, and event-driven integration capabilities.

    **Core Capabilities:**
    - Photo-first post creation (1-10 photos required)
    - PostGIS-powered geospatial search and discovery
    - Multi-tenant organization support with data isolation
    - Real-time event publishing for downstream services
    - Post lifecycle management (active → resolved/expired/deleted)
    - Google Cloud Storage integration for scalable photo storage

    **Service Boundaries:**
    This service manages the complete post lifecycle from creation through resolution,
    handles photo upload and storage, provides location-based search capabilities,
    and publishes domain events for notification and matching services.
  version: 1.0.0
  contact:
    name: Posts Domain Team
    url: https://github.com/fn-posts/api
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.posts.findlynow.com
    description: Production server

tags:
  - name: health
    description: Service health and status endpoints
  - name: posts
    description: Post creation, management, and search
  - name: photos
    description: Photo upload and management
  - name: search
    description: Location-based post discovery

paths:
  /health:
    get:
      tags: [health]
      summary: Check service health
      description: Returns the current health status of the Posts domain service
      operationId: checkHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        enum: [healthy, unhealthy]
                      storage:
                        type: string
                        enum: [healthy, unhealthy]
                      kafka:
                        type: string
                        enum: [healthy, unhealthy]
                  timestamp:
                    type: string
                    format: date-time

  /posts:
    get:
      tags: [posts]
      summary: List posts
      description: Retrieve a paginated list of posts
      operationId: listPosts
      parameters:
        - name: status
          in: query
          description: Filter by post status
          schema:
            type: string
            enum: [active, resolved, expired, deleted]
        - name: type
          in: query
          description: Filter by post type
          schema:
            type: string
            enum: [lost, found]
        - name: organization_id
          in: query
          description: Filter by organization (multi-tenant)
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Number of posts to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of posts to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  total:
                    type: integer
                  has_more:
                    type: boolean

    post:
      tags: [posts]
      summary: Create a new post
      description: Create a new lost or found item post with photos
      operationId: createPost
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - type
                - latitude
                - longitude
                - photos
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Brief title describing the item
                description:
                  type: string
                  maxLength: 1000
                  description: Detailed description of the item
                type:
                  type: string
                  enum: [lost, found]
                  description: Whether this is a lost or found item
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  description: Location latitude
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  description: Location longitude
                radius_meters:
                  type: integer
                  minimum: 100
                  maximum: 50000
                  default: 1000
                  description: Search radius in meters
                organization_id:
                  type: string
                  format: uuid
                  description: Organization ID for multi-tenant environments
                photos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                  description: Photo files (1-10 required)
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request entity too large (photos too big)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{post_id}:
    get:
      tags: [posts]
      summary: Get post by ID
      description: Retrieve a specific post by its ID
      operationId: getPost
      parameters:
        - name: post_id
          in: path
          required: true
          description: Post ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [posts]
      summary: Update post
      description: Update post details (owner only)
      operationId: updatePost
      parameters:
        - name: post_id
          in: path
          required: true
          description: Post ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 1000
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                radius_meters:
                  type: integer
                  minimum: 100
                  maximum: 50000
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to update this post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [posts]
      summary: Delete post
      description: Mark post as deleted (soft delete)
      operationId: deletePost
      parameters:
        - name: post_id
          in: path
          required: true
          description: Post ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Post deleted successfully
        '403':
          description: Not authorized to delete this post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{post_id}/status:
    patch:
      tags: [posts]
      summary: Update post status
      description: Update the status of a post (resolve, reactivate, etc.)
      operationId: updatePostStatus
      parameters:
        - name: post_id
          in: path
          required: true
          description: Post ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, resolved, expired]
                  description: New status for the post
                reason:
                  type: string
                  maxLength: 500
                  description: Reason for status change
      responses:
        '200':
          description: Post status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to update this post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/nearby:
    get:
      tags: [search]
      summary: Search nearby posts
      description: Find posts within a specified radius of a location
      operationId: findNearbyPosts
      parameters:
        - name: latitude
          in: query
          required: true
          description: Search center latitude
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          description: Search center longitude
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: radius
          in: query
          description: Search radius in meters
          schema:
            type: integer
            minimum: 100
            maximum: 50000
            default: 1000
        - name: type
          in: query
          description: Filter by post type
          schema:
            type: string
            enum: [lost, found]
        - name: created_after
          in: query
          description: Only posts created after this date
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Nearby posts found
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Post'
                        - type: object
                          properties:
                            distance_meters:
                              type: number
                              description: Distance from search center
                  search_area:
                    type: object
                    properties:
                      center:
                        $ref: '#/components/schemas/Location'
                      radius_meters:
                        type: integer
                      posts_found:
                        type: integer
        '400':
          description: Invalid search parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{post_id}/photos:
    post:
      tags: [photos]
      summary: Add photos to post
      description: Add additional photos to an existing post
      operationId: addPhotosToPost
      parameters:
        - name: post_id
          in: path
          required: true
          description: Post ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photos
              properties:
                photos:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    format: binary
                  description: Additional photo files
      responses:
        '201':
          description: Photos added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  photos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Photo'
        '400':
          description: Invalid request or too many photos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to modify this post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /photos/{photo_id}:
    delete:
      tags: [photos]
      summary: Delete photo
      description: Remove a photo from a post
      operationId: deletePhoto
      parameters:
        - name: photo_id
          in: path
          required: true
          description: Photo ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Photo deleted successfully
        '403':
          description: Not authorized to delete this photo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Photo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Post:
      type: object
      required:
        - id
        - title
        - type
        - status
        - location
        - photos
        - user_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique post identifier
        title:
          type: string
          description: Post title
          example: "Lost iPhone 13 Pro"
        description:
          type: string
          description: Detailed description
          example: "Black iPhone 13 Pro lost near Central Park entrance"
        type:
          type: string
          enum: [lost, found]
          description: Post type
        status:
          type: string
          enum: [active, resolved, expired, deleted]
          description: Current post status
        location:
          $ref: '#/components/schemas/Location'
        radius_meters:
          type: integer
          description: Search radius for this post
          example: 1000
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
          description: Associated photos
        user_id:
          type: string
          format: uuid
          description: ID of user who created the post
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: Organization ID for multi-tenant setups
        created_at:
          type: string
          format: date-time
          description: Post creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    Location:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Location latitude
          example: 40.7829
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Location longitude
          example: -73.9654
        address:
          type: string
          description: Human-readable address
          example: "Central Park, New York, NY"

    Photo:
      type: object
      required:
        - id
        - post_id
        - original_url
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique photo identifier
        post_id:
          type: string
          format: uuid
          description: Associated post ID
        original_url:
          type: string
          format: uri
          description: URL to original photo
          example: "https://storage.example.com/posts/original/photo-1.jpg"
        thumbnail_url:
          type: string
          format: uri
          nullable: true
          description: URL to thumbnail version
          example: "https://storage.example.com/posts/thumbs/photo-1-thumb.jpg"
        filename:
          type: string
          description: Original filename
          example: "iphone-photo.jpg"
        file_size:
          type: integer
          description: File size in bytes
          example: 2048576
        mime_type:
          type: string
          description: MIME type
          example: "image/jpeg"
        width:
          type: integer
          description: Image width in pixels
          example: 1920
        height:
          type: integer
          description: Image height in pixels
          example: 1080
        order:
          type: integer
          description: Display order within post
          example: 1
        created_at:
          type: string
          format: date-time
          description: Photo upload timestamp

    Error:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
          description: Error type
          enum:
            - validation_error
            - authentication_error
            - authorization_error
            - not_found_error
            - conflict_error
            - upload_error
            - server_error
        message:
          type: string
          description: Human-readable error message
          example: "Photos are required for post creation"
        field:
          type: string
          description: Field that caused the error (for validation errors)
          example: "photos"
        code:
          type: string
          description: Machine-readable error code
          example: "PHOTOS_REQUIRED"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

security:
  - BearerAuth: []